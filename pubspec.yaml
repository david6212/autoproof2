name: bonnetcheck
description: "BonnetCheck — trusted marketplace for buying used cars in Israel."
publish_to: 'none'

version: 0.8.3+11

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_analytics: ^11.0.0

  # State Management
  flutter_riverpod: ^2.5.0

  # Navigation
  go_router: ^14.0.0

  # HTTP — data.gov.il API
  dio: ^5.4.0

  # UI helpers
  cached_network_image: ^3.3.0
  image_picker: ^1.1.0
  # Decoding, black-box burn-in and re-encoding for the document redactor.
  # Pure Dart, so the same code runs on the phone and in the browser —
  # `dart:ui` was the alternative and can only encode PNG, which for a photo
  # of a licence is several megabytes and would never fit a Firestore
  # document.
  image: ^4.9.2
  # image_cropper — re-added in Phase 5 (photo upload). Removed for now
  # because 5.0.x references UnmodifiableUint8ListView, removed in Dart 3.4+.

  # Utils
  intl: ^0.19.0
  flutter_secure_storage: ^9.0.0
  url_launcher: ^6.3.2
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  geolocator: ^14.0.2
  share_plus: ^12.0.2
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    # Bundled, not fetched. The font-fetching package downloaded these from
    # Google's servers on first paint, which sent every reader's IP address to
    # a third party before anything was on screen — the fact pattern of
    # LG München I,
    # 3 O 17493/20. The landing site already self-hosted its copies; only the
    # app leaked. Both families are SIL Open Font License 1.1; the licence
    # texts ship beside them and are registered in main.dart.
    - family: Heebo
      fonts:
        - asset: assets/fonts/Heebo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Heebo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Heebo-Bold.ttf
          weight: 700
    # Flutter's web engine downloads Roboto from Google for anything it
    # cannot resolve locally — measured on the live site. Heebo IS Roboto's
    # Latin with Hebrew added, so answering the name with the files we already
    # bundle is both private and visually correct.
    - family: Roboto
      fonts:
        - asset: assets/fonts/Heebo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Heebo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Heebo-Bold.ttf
          weight: 700
    - family: Poppins
      fonts:
        # Bold only — Poppins is used for one thing, the wordmark.
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

  assets:
    # logo_full.png / logo_emblem.png are no longer bundled: the mark is drawn
    # in code by BrandLogo, and logo_full still carried the old "AUTOPROOF"
    # wordmark. The files stay on disk for regenerating launcher icons.
    - assets/layers/car.png
    - assets/google_g.png
    - assets/data/inspection_centers_geo.json
    # Read at startup and registered with Flutter's licence page. The OFL
    # requires the licence to travel with the font.
    - assets/fonts/OFL-Heebo.txt
    - assets/fonts/OFL-Poppins.txt
